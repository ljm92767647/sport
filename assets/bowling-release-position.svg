<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
<title id="title">오른손 볼링의 릴리스 위치와 첫 진행 방향</title><desc id="desc">왼발로 슬라이드하고, 왼발 오른쪽 발목 옆에서 공을 놓는다. 오른발은 뒤로 비켜 주며 공을 선택한 화살표 쪽으로 보낸다. 위치와 각도는 개념도다.</desc>

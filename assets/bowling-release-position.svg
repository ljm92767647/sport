<g font-family="Malgun Gothic, Arial, sans-serif" font-size="17" fill="#263c30"><text x="117" y="444">왼발 슬라이드</text><text x="436" y="418">공을 놓는 곳</text><text x="447" y="484">오른발은 뒤로</text><text x="434" y="125">고른 화살표</text><text x="102" y="331" font-size="14" fill="#b74639">파울 라인</text><text x="120" y="63" font-size="15" fill="#596d60">핀 방향</text></g>
